plugins { id "com.android.application" }

android {
    namespace "ar.sintonia"
    compileSdk 36
    defaultConfig {
        applicationId "ar.sintonia"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging true } }
    androidResources { noCompress += ["otf", "ttf", "pem"] }
}

dependencies {
    implementation "dev.jdtech.mpv:libmpv:0.4.1"
    implementation "org.libtorrent4j:libtorrent4j:2.1.0-35"
    implementation "org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-35"
    implementation "org.libtorrent4j:libtorrent4j-android-x86_64:2.1.0-35"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
}
